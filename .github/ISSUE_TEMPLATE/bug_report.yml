name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API keys, VAS keys, callback secrets, phone numbers or account numbers.** Use placeholders.
        Security problems must be reported privately (see SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0-preview.1
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Moolre environment
      options: [Sandbox, Live]
    validations:
      required: true
  - type: input
    id: dotnet
    attributes:
      label: .NET version
      placeholder: "10.0.x"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      render: csharp
  - type: input
    id: code
    attributes:
      label: Moolre application code returned (if any)
      placeholder: "for example TP13 or ASL06"
