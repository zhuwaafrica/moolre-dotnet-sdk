name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the SDK to do?
  - type: input
    id: moolre-doc
    attributes:
      label: Link to the Moolre documentation for this (if it exists)
