version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      analyzers:
        patterns:
          - "Microsoft.CodeAnalysis.*"
      xunit:
        patterns:
          - "xunit*"
